header{border-top:6px solid var(--accent)}
.top{display:flex;align-items:center;gap:12px;padding-block:18px 6px;flex-wrap:wrap}
.brand{font-weight:900;letter-spacing:.06em;font-size:14px;color:var(--ink-2)}
.lang{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:transparent;border:0;padding:4px 12px;cursor:pointer;color:var(--ink-3);font-size:13px}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
h1{font-size:clamp(26px,5vw,40px);font-weight:900;margin:6px 0 4px;line-height:1.25;text-wrap:balance}
h1 span{color:var(--accent)}
.lead{color:var(--ink-2);margin:0 0 18px;max-width:40em}

.moods{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.mood{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--ink-2);font-size:14px}
.mood[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}

.stage{background:var(--panel);border-radius:16px;padding:20px;display:grid;gap:18px}
.stage-head{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.pname{font-size:22px;font-weight:900}
.roman{font-family:var(--mono);color:var(--ink-3);font-size:13px}
.pdesc{color:var(--ink-2);font-size:14px;width:100%;margin:0}
.chords{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}

.chord .nm{font-family:var(--mono);font-weight:700;font-size:clamp(20px,4vw,30px);line-height:1.2}
.chord .bar{font-size:11px;color:var(--ink-3)}
.chord.on{border-color:var(--accent);transform:translateY(-2px)}
.chord:hover{border-color:var(--line)}

.piano{position:relative;height:96px;background:var(--panel-2);border-radius:10px;overflow:hidden}
.piano svg{display:block;width:100%;height:100%}

.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.play{background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:10px 24px;font-weight:900;cursor:pointer;font-size:16px;min-width:120px}
.btn{background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.field{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:13px}
select{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
input[type=range]{accent-color:var(--accent);width:120px}
.bpm{font-family:var(--mono);min-width:3ch;text-align:right;color:var(--ink)}
.check{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.check input{accent-color:var(--accent)}

.list{margin-top:26px}
.list h2{font-size:18px;margin:0 0 10px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:8px}
.pitem{background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;display:grid;gap:2px}

.pitem .a{font-weight:700;font-size:14px}
.pitem .b{font-family:var(--mono);font-size:12px;color:var(--ink-3)}

.cta p{margin:0;color:var(--ink-2);font-size:14px}
.cta a{background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:900;border-radius:999px;padding:10px 20px;white-space:nowrap}

footer{color:var(--ink-3);font-size:12px;padding-block:30px 40px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</main>

function voice(pcs, prevCentroid){
  const n = pcs.length; let best = null;
  for(let inv=0; inv<n; inv++){
    const order = pcs.slice(inv).concat(pcs.slice(0,inv));
    for(let low=54; low<=66; low++){
      if(low%12 !== order[0]) continue;
      const notes=[low];
      for(let i=1;i<n;i++){ let p=notes[i-1]+1; while(p%12!==order[i]) p++; notes.push(p); }

}

    bar:(i)=>`Bar ${i}`, list:'All progressions', minorKey:'minor', majorKey:'major',
    ctaTitle:'Want these in your DAW?',
    ctaText:'Get the MIDI pack: 29 progressions × all 12 keys (348 files). Drag, drop, and the chords and bass play. Royalty-free.',
    ctaLink:'See the MIDI pack',
    faq:[
      ['I can\'t hear anything','Turn off silent mode, raise the volume, then press Play. On iPhone, the side switch must not be set to silent.'],
      ['Can I release songs I make with this?','Yes. Chord progressions are common musical knowledge — use them freely.'],
      ['How do I read the Roman numerals?','"I" is the first note of the key; each numeral shows which scale degree the chord starts on. Lowercase (like vi) means a minor chord. The numerals stay the same in every key.']
    ],
    foot:'© Carol Works · Sounds are simple tones synthesized by your browser.'
  }
};

/* ---------- state ---------- */
let lang = "ja";
try{ const s=localStorage.getItem("cpg-lang"); if(s==="en"||s==="ja") lang=s; else if(!/^ja/i.test(navigator.language||"")) lang="en"; }catch(e){ if(!/^ja/i.test(navigator.language||"")) lang="en"; }
let mood = "all", current = PROGS[0], key = 0, bpm = current.bpm, withBass = true;
const $ = (id)=>document.getElementById(id);

/* ---------- UI ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function keyName(){ return keyText(key,current.mode)+" "+(current.mode==="min"?T[lang].minorKey:T[lang].majorKey); }
function drawText(){
  const t=T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.lang===lang)));
  $("h1").innerHTML=t.h1; $("lead").textContent=t.lead;
  $("random").textContent=t.random; $("lblKey").textContent=t.key; $("lblTempo").textContent=t.tempo; $("lblBass").textContent=t.bass;
  $("listTitle").textContent=t.list; $("ctaTitle").textContent=t.ctaTitle; $("ctaText").textContent=t.ctaText;
  $("ctaLink").textContent=t.ctaLink; $("ctaLink").href=LINKS[lang];
  $("faq").innerHTML=t.faq.map(([q,a])=>`<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join("");
  $("foot").textContent=t.foot;
  $("moods").innerHTML=MOODS.map(([id,ja,en])=>`<button type="button" class="mood" data-mood="${id}" aria-pressed="${mood===id}">${esc(lang==="ja"?ja:en)}</button>`).join("");
  $("key").innerHTML=KEY_LABEL.map((k,i)=>`<option value="${i}" ${i===key?"selected":""}>${esc(k)}</option>`).join("");
  $("play").textContent = playing ? t.stop : t.play;
  drawProg(); drawList();
}
function drawProg(){
  const chords = render(current, key);
  $("pname").textContent = (lang==="ja"?current.ja:current.en)+" — "+keyName();
  $("roman").textContent = current.roman;
  $("pdesc").textContent = lang==="ja"?current.dja:current.den;
  $("chords").innerHTML = chords.map((c,i)=>`<div class="chord${i===activeBar?" on":""}" data-bar="${i}"><div class="nm">${esc(c.name)}</div><div class="bar">${esc(T[lang].bar(i+1))}</div></div>`).join("");
  $("tempo").value = bpm; $("bpm").textContent = bpm;
  drawPiano(chords[activeBar>=0?activeBar:0]);
}
function drawList(){
  const list = PROGS.filter(p=>mood==="all"||p.moods.includes(mood));
  $("plist").innerHTML = list.map(p=>{
    const names = render(p,key).map(c=>c.name).join(" → ");
    return `<button type="button" class="pitem" data-id="${p.id}" aria-current="${p===current}"><span class="a">${esc(lang==="ja"?p.ja:p.en)}</span><span class="b">${esc(names)}</span></button>`;
  }).join("");
}
function drawPiano(chord){
  const lo=36, hi=84; const whites=[]; const blacks=[];
  const isBlack=(n)=>[1,3,6,8,10].includes(n%12);
  for(let n=lo;n<=hi;n++){ if(!isBlack(n)) whites.push(n); }
  const W=whites.length, w=100/W;
  const on=new Set(chord?[...chord.notes].concat(withBass?[chord.bass]:[]):[]);
  let s=`<svg viewBox="0 0 100 30" preserveAspectRatio="none">`;
  whites.forEach((n,i)=>{ s+=`<rect x="${i*w}" y="0" width="${w-0.15}" height="30" fill="${on.has(n)?"#f2a541":"#f4f1ea"}"/>`; });
  for(let n=lo;n<=hi;n++){
    if(!isBlack(n)) continue;
    const idx=whites.filter(x=>x<n).length;
    s+=`<rect x="${idx*w-w*0.32}" y="0" width="${w*0.64}" height="18" fill="${on.has(n)?"#ffd08a":"#231d3d"}"/>`;
  }
  s+=`</svg>`; $("piano").innerHTML=s;
}
function select(p){ stop(); current=p; bpm=p.bpm; activeBar=-1; drawProg(); drawList(); }

document.querySelector(".lang").addEventListener("click",e=>{ const b=e.target.closest("[data-lang]"); if(!b) return; lang=b.dataset.lang; try{localStorage.setItem("cpg-lang",lang);}catch(err){} drawText(); });
$("moods").addEventListener("click",e=>{ const b=e.target.closest("[data-mood]"); if(!b) return; mood=b.dataset.mood;
  const list=PROGS.filter(p=>mood==="all"||p.moods.includes(mood)); if(!list.includes(current)) select(list[0]);
  drawText(); });
$("plist").addEventListener("click",e=>{ const b=e.target.closest("[data-id]"); if(!b) return; select(PROGS.find(p=>p.id===+b.dataset.id)); });
$("key").addEventListener("change",e=>{ key=+e.target.value; drawProg(); drawList(); });
$("tempo").addEventListener("input",e=>{ bpm=+e.target.value; $("bpm").textContent=bpm; });
$("bass").addEventListener("change",e=>{ withBass=e.target.checked; drawProg(); });
$("random").addEventListener("click",()=>{
  const list=PROGS.filter(p=>(mood==="all"||p.moods.includes(mood))&&p!==current);
  const p=list[Math.floor(Math.random()*list.length)]||current; key=Math.floor(Math.random()*12); select(p); $("key").value=key; start();
});
$("chords").addEventListener("click",e=>{ const c=e.target.closest("[data-bar]"); if(!c) return; previewBar(+c.dataset.bar); });
$("play").addEventListener("click",()=>{ playing?stop():start(); });

/* ---------- audio ---------- */
let ctx=null, master=null, playing=false, timer=null, nextTime=0, barIdx=0, activeBar=-1, uiTimers=[];
function ensureCtx(){
  if(!ctx){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null; ctx=new AC();
    master=ctx.createGain(); master.gain.value=0.5;
    const comp=ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination); }
  if(ctx.state==="suspended") ctx.resume();
  return ctx;
}
const hz=(m)=>440*Math.pow(2,(m-69)/12);
function pad(m,t,dur){
  const g=ctx.createGain(); const f=ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=1800; f.Q.value=0.4;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.09,t+0.04); g.gain.setTargetAtTime(0.06,t+0.1,0.3); g.gain.setTargetAtTime(0,t+dur-0.08,0.05);
  [-6,6].forEach(det=>{ const o=ctx.createOscillator(); o.type="triangle"; o.frequency.value=hz(m); o.detune.value=det; o.connect(f); o.start(t); o.stop(t+dur+0.3); });
  f.connect(g); g.connect(master);
}
function bassNote(m,t,dur){
  const g=ctx.createGain(); const o=ctx.createOscillator(); o.type="sine"; o.frequency.value=hz(m);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.28,t+0.02); g.gain.setTargetAtTime(0.18,t+0.05,0.4); g.gain.setTargetAtTime(0,t+dur-0.08,0.05);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.3);
}
function playBar(chord,t,dur){ chord.notes.forEach(n=>pad(n,t,dur)); if(withBass) bassNote(chord.bass,t,dur); }
function setActive(i){ activeBar=i; document.querySelectorAll("#chords .chord").forEach((el,j)=>el.classList.toggle("on",j===i)); const ch=render(current,key); drawPiano(ch[i>=0?i:0]); }
function schedule(){
  const chords=render(current,key);
  while(nextTime < ctx.currentTime+0.3){
    const dur=60/bpm*4; const i=barIdx%chords.length; const t=nextTime;
    playBar(chords[i],t,dur);
    uiTimers.push(setTimeout(()=>{ if(playing) setActive(i); }, Math.max(0,(t-ctx.currentTime)*1000)));
    nextTime+=dur; barIdx++;
  }
}
function start(){
  if(!ensureCtx()) return;
  playing=true; $("play").textContent=T[lang].stop; barIdx=0; nextTime=ctx.currentTime+0.06;
  schedule(); timer=setInterval(schedule,100);
}
function stop(){
  playing=false; clearInterval(timer); timer=null; uiTimers.forEach(clearTimeout); uiTimers=[];
  if(master&&ctx){ const old=master; old.gain.setTargetAtTime(0,ctx.currentTime,0.03); setTimeout(()=>{ try{old.disconnect();}catch(e){} },300);
    master=ctx.createGain(); master.gain.value=0.5; const comp=ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination); }
  $("play").textContent=T[lang].play; setActive(-1);
}
function previewBar(i){ if(!ensureCtx()) return; const ch=render(current,key); if(!playing){ playBar(ch[i],ctx.currentTime+0.03,1.4); setActive(i); } }

drawText();
})();
</script>
</body>
</html>
